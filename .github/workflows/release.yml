name: Create Release Files

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Create trainer package
      run: |
        source .venv/bin/activate
        hafnia trainer create-zip .
        
    - name: Get commit info
      id: commit
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "timestamp=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
        
    - name: Upload trainer package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: trainer-package-${{ steps.commit.outputs.timestamp }}-${{ steps.commit.outputs.sha_short }}
        path: trainer.zip
        
